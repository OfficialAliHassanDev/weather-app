<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyCast Weather</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background-animation"></div>

  <div class="container">

    <div class="weather-card">

      <div class="search-box">
        <input type="text" placeholder="Enter city name" id="cityInput">
        <button id="searchBtn">🔍</button>
      </div>

      <div class="weather-info">
        <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" class="weather-icon">

        <h1 class="temp">26°C</h1>
        <h2 class="city">Lahore</h2>

        <div class="details">

          <div class="col">
            <div>
              <p class="label">Humidity</p>
              <p class="humidity">65%</p>
            </div>
          </div>

          <div class="col">
            <div>
              <p class="label">Wind</p>
              <p class="wind">15 km/h</p>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
